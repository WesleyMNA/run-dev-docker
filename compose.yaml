services:
  next:
    container_name: next
    
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /app/.next

    environment:
      - WATCHPACK_POLLING=true

    command: npm run dev

volumes:
  node_modules: